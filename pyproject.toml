[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleep-patterns"
version = "0.1.0"
description = "Analysis of a year of personal sleep-tracker and caffeine logs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aditya Verma" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]
